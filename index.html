<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-card">
    <h1>Welcome Back!</h1>
    <p>Enter your credentials to access your account</p>

    <label for="email">Email Address</label>
    <input type="email" placeholder="natengineer@gmail.com">

    <label for="password">Password</label>
    <input type="password" placeholder="........">

    <div class="remember-row">
        <div class="remember-left">
    <input type="checkbox" id="remember">
     <label for="remember">Remember Me</label>
            </div>
     <a href="#">Forgot Password?</a>
          </div>

     <button id="btn">Sign in to your account</button>

     <div class="social-row">
     <button type="button" class="social-btn">Continue with Google</button>
     <button type="button" class="social-btn">Continue with Apple</button>
      </div>
     <p>Don't have an account? <a href="#">Create account</a></p>

     <footer>
        &copy;2026 Built by Devran
     </footer>
     </div>
</body>
</html>
